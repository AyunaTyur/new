<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMum</title>
    <style>
        h1 {
            color: #000000;
            font-size: 64px;
            text-align: center;
        }
        p {
            color: #000000;
            font-size: 24px;
            text-align: center;
        }
        .photo-block {
            display: flex; 
            align-items: flex-start; 
            justify-content: center;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .photo-block {
                flex-direction: column; 
                align-items: center;
                gap: 20px;
            }
            .photo-block img {
                max-width: 100%; 
                height: auto;   
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Дорогая мама,</h1>
    <p>Поздравляю тебя с днем рождения❤️</p>
    <br>
    <h2>Хочу сказать тебе</h2>
    <br>

<p style="margin-top: 70px;"></p>

<div class="photo-block" style="gap: 50px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <img src="one.png" alt="a" height="400" width="520">
        <p style="margin: 0; text-align: center; max-width: 520px;">
            Спасибо тебе за твое тепло, заботу и поддержку
        </p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <img src="two.png" alt="b" height="400">
        <p style="margin: 0; text-align: center; max-width: 300px;">
             Спасибо за твою любовь
        </p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <img src="three.png" alt="c" height="400">
        <p style="margin: 0; text-align: center; max-width: 300px;">
            Ты самая лучшая на свете
        </p>
    </div>
</div>

<br>

<div class="photo-block" style="gap: 130px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 30px;">
        <img src="four.png" alt="a" height="400" width="520">
        <p style="margin: 0; text-align: center; max-width: 520px;">
            Спасибо за то, что показала нам мир
        </p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <img src="six.png" alt="b" height="400">
        <p style="margin: 0; text-align: center; max-width: 300px;">
            Спасибо за то, что ты вкладываешь в нас всю свою душу
        </p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <img src="five.png" alt="c" height="400">
        <p style="margin: 0; text-align: center; max-width: 300px;">
            И просто за то, что ты — наша мама
        </p>
    </div>
</div>
    <br>
    <button onclick="alert('Мама, я тебя очень люблю! ❤️')">Нажми на меня!</button>
</body>
</html>
